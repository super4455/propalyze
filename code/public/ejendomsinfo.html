<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <title>Ejendomsinfo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<p><a href="/">← Tilbage til søgning</a></p>

  <div id="fejl"></div>

  <h1 id="adresse">—</h1>

  <div class="data_gruppe">
    <div class="data_felt">
      <span class="data_label">Ejendomstype</span>
      <span class="data_vaerdi" id="ejendomstype">—</span>
    </div>
    <div class="data_felt">
      <span class="data_label">Byggeår</span>
      <span class="data_vaerdi" id="byggeaar">—</span>
    </div>
    <div class="data_felt">
      <span class="data_label">Boligareal</span>
      <span class="data_vaerdi" id="boligareal">—</span>
    </div>
    <div class="data_felt" id="grundareal_raekke">
      <span class="data_label">Grundareal</span>
      <span class="data_vaerdi" id="grundareal">—</span>
    </div>
    <div class="data_felt">
      <span class="data_label">Værelser</span>
      <span class="data_vaerdi" id="vaerelser">—</span>
    </div>
    <div class="data_felt">
      <span class="data_label">Antal etager</span>
      <span class="data_vaerdi" id="antalEtager">—</span>
    </div>
  </div>

  <div id="kort_sektion">
    <h3>Kort</h3>
    <p id="kort_loading">Henter luftfoto og matrikelkort...</p>
    <div class="kort_overlay">
      <img id="luftfoto_billede" style="display: none;">
      <img id="matrikel_billede" style="display: none;">
    </div>
  </div>

  <div class="knapper">
    <button id="gem_knap" class="simulering_knap" style="display: none;">Gem ejendomsprofil</button>
  </div>

  <div id="besked"></div>

  <script src="/js/ejendomsinfo.js"></script>
</body>

</html>
