<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Propalyze</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header id="forside_header" class="forside">
    <h1 id="brand">Propalyze</h1>
  </header>

  <p id="soeg_intro">Søg efter en dansk adresse for at oprette en ejendomsprofil</p>

  <!-- Søgefelt og resultater -->
  <input type="text" id="soegefelt" placeholder="Skriv en adresse...">
  <div id="resultater" class="resultater"></div>

  <!-- Gemte ejendomsprofiler -->
  <div id="profiler_sektion">
    <h2>Gemte ejendomsprofiler</h2>
    <a href="/sammenligning.html">Sammenlign investeringscases →</a>
    <div id="profil_liste"></div>
  </div>

  <!-- Ejendomsprofil popup -->
  <div id="profil_modal" class="modal" style="display: none;">
    <div id="profil_modal_indhold" class="modal_indhold">
      <button id="profil_modal_luk" class="luk_knap">×</button>
      <h2 id="modal_adresse"></h2>
      <dl id="modal_data">
        <div class="modal_raekke"><dt>Ejendomstype</dt><dd id="modal_ejendomstype">—</dd></div>
        <div class="modal_raekke"><dt>Byggeår</dt><dd id="modal_byggeaar">—</dd></div>
        <div class="modal_raekke"><dt>Boligareal</dt><dd id="modal_boligareal">—</dd></div>
        <div class="modal_raekke"><dt>Grundareal</dt><dd id="modal_grundareal">—</dd></div>
        <div class="modal_raekke"><dt>Værelser</dt><dd id="modal_vaerelser">—</dd></div>
      </dl>
      <div id="modal_kort_sektion" class="kort_sektion">
        <div>
          <p class="kort_label">Luftfoto</p>
          <img id="modal_luftfoto" style="display: none;">
          <p id="modal_luftfoto_loading">Henter luftfoto...</p>
        </div>
        <div>
          <p class="kort_label">Matrikelkort</p>
          <img id="modal_matrikel" style="display: none;">
          <p id="modal_matrikel_loading">Henter matrikelkort...</p>
        </div>
      </div>
      <button id="modal_opdater_knap">Opdatér BBR-data</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
