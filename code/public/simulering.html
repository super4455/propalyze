<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <title>Simulering - Propalyze</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <h1>Propalyze</h1>
  <a href="/">← Tilbage til forsiden</a>

  <h2>Simulering af investeringscase</h2>

  <div id="fejl"></div>

  <!-- Brugerens input til simulering -->
  <div id="simulering_input">
    <label for="periode">Simuleringsperiode (år, min. 30):</label>
    <input type="number" id="periode" value="30" min="30" max="100">

    <label for="vaerdistigning">Forventet årlig værdistigning (%):</label>
    <input type="number" id="vaerdistigning" value="2" step="0.1" min="0">

    <button id="start_simulering_knap" class="knap_primaer">Kør simulering</button>
  </div>

  <!-- Overblik over case-parametre -->
  <div id="parametre_sektion" style="display: none;">
    <h3>Parametre</h3>
    <div id="parametre_liste"></div>
  </div>

  <!-- Simuleringsresultat som tabel -->
  <div id="resultat_sektion" style="display: none;">
    <h3>Simuleringsresultat</h3>
    <table id="simulering_tabel">
      <thead>
        <tr>
          <th>År</th>
          <th>Ejendomsværdi</th>
          <th>Gæld</th>
          <th>Egenkapital</th>
          <th>Cashflow (år)</th>
        </tr>
      </thead>
      <tbody id="simulering_tbody"></tbody>
    </table>
  </div>

  <script src="/js/simulering.js"></script>
</body>

</html>
